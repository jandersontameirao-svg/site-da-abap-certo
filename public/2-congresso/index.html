<title>Galeria · 2º Congresso ABAP</title>
<meta name="description" content="Galeria de fotos do 2º Congresso e Reunião Anual da Associação Brasileira de Arqueologia Preventiva (ABAP).">
<style>
:root{--black:#0e0b0a;--panel:#171210;--card:#1e1815;--line:#2c2420;--txt:#f4efe9;--muted:#b6aaa0;--orange:#d2703a;--amber:#e0a34d;--grad:linear-gradient(90deg,#d2703a,#e0a34d)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:rgba(14,11,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-weight:800;letter-spacing:.14em;font-size:18px}
.back{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:9px 16px;border-radius:5px;transition:.25s}
.back:hover{border-color:var(--orange);color:var(--txt)}
.hero{text-align:center;padding:70px 24px 40px}
.kicker{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.hero h1{font-size:clamp(30px,5vw,52px);margin-top:14px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:16px auto 0;max-width:620px;font-size:15px}
.grid{columns:4 260px;column-gap:14px;padding:20px 24px 80px;max-width:1240px;margin:0 auto}
.gitem{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:none;cursor:pointer;break-inside:avoid;border-radius:6px;overflow:hidden;line-height:0}
.gitem img{width:100%;height:auto;display:block;transition:.4s;filter:saturate(.96)}
.gitem:hover img{transform:scale(1.05);filter:saturate(1.1)}
.lb{position:fixed;inset:0;background:rgba(7,5,5,.95);display:none;align-items:center;justify-content:center;z-index:50}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:6px}
.lb .x,.lb .nav{position:absolute;background:rgba(255,255,255,.08);border:1px solid var(--line);color:#fff;cursor:pointer;border-radius:50%;width:52px;height:52px;font-size:24px;display:flex;align-items:center;justify-content:center;transition:.25s}
.lb .x:hover,.lb .nav:hover{background:var(--orange)}
.lb .x{top:22px;right:22px}
.lb .prev{left:22px;top:50%;transform:translateY(-50%)}
.lb .next{right:22px;top:50%;transform:translateY(-50%)}
.count{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:13px;letter-spacing:.05em}
@media(max-width:600px){.grid{columns:2 140px}.lb .nav{width:44px;height:44px}}
</style></head><body>

<script>
var N=265,cur=1;
function pad(n){return (n<100?(n<10?'00':'0'):'')+n}
function openLb(i){cur=i;show();document.getElementById('lb').classList.add('open');document.body.style.overflow='hidden'}
function closeLb(){document.getElementById('lb').classList.remove('open');document.body.style.overflow=''}
function move(d){cur=((cur-1+d+N)%N)+1;show()}
function show(){document.getElementById('lbimg').src='/2-congresso/assets/'+pad(cur)+'.jpg';document.getElementById('count').textContent=cur+' / '+N}
document.getElementById('lb').addEventListener('click',function(e){if(e.target===this)closeLb()});
document.addEventListener('keydown',function(e){if(!document.getElementById('lb').classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
</script></body></html>
